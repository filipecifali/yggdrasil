kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: yggdrasil
nodes:
  # ===========================================================================
  # Control-Plane Node (Host Port Mappings for Local Simulation)
  # ===========================================================================
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Web Hosting & Edge Gateway (HTTP / HTTPS via Envoy Gateway NodePorts)
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
      # DNS (Mapped to 5353 on host by default to avoid WSL systemd-resolved conflict on port 53)
      - containerPort: 30053
        hostPort: 5353
        protocol: UDP
      - containerPort: 30053
        hostPort: 5353
        protocol: TCP
      # Email (SMTP, Submission, IMAPS)
      - containerPort: 30025
        hostPort: 2525
        protocol: TCP
      - containerPort: 30587
        hostPort: 587
        protocol: TCP
      - containerPort: 30993
        hostPort: 993
        protocol: TCP

  # ===========================================================================
  # Platform Node Pool (3 Nodes — Operators, Edge Gateway, PKI, DNS, Monitoring, Storage)
  # ===========================================================================
  - role: worker
    labels:
      yggdrasil.io/node-pool: platform
  - role: worker
    labels:
      yggdrasil.io/node-pool: platform
  - role: worker
    labels:
      yggdrasil.io/node-pool: platform

  # ===========================================================================
  # Application Node Pool (3 Nodes — Web, Mail, Git Forge, CI Runners)
  # ===========================================================================
  - role: worker
    labels:
      yggdrasil.io/node-pool: apps
  - role: worker
    labels:
      yggdrasil.io/node-pool: apps
  - role: worker
    labels:
      yggdrasil.io/node-pool: apps
