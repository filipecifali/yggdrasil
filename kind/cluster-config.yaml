kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: yggdrasil
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  # ===========================================================================
  # HA Control-Plane Pool (3 Nodes — Stacked etcd Quorum + HAProxy API LB)
  # Note: extraPortMappings are bound on the primary control-plane container
  # (kube-proxy routes NodePorts across all cluster nodes).
  # ===========================================================================
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Web Hosting & Edge Gateway (HTTP / HTTPS via Envoy Gateway NodePorts)
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
      # DNS (Mapped to 5353 on host by default to avoid WSL systemd-resolved conflict on port 53)
      - containerPort: 30053
        hostPort: 5353
        protocol: UDP
      - containerPort: 30053
        hostPort: 5353
        protocol: TCP
      # Email (SMTP, Submission, IMAPS)
      - containerPort: 30025
        hostPort: 2525
        protocol: TCP
      - containerPort: 30587
        hostPort: 587
        protocol: TCP
      - containerPort: 30993
        hostPort: 993
        protocol: TCP
  - role: control-plane
  - role: control-plane

  # ===========================================================================
  # Platform Node Pool (3 Nodes — Operators, Edge Gateway, PKI, DNS, Monitoring, Storage)
  # ===========================================================================
  - role: worker
    labels:
      yggdrasil.io/node-pool: platform
  - role: worker
    labels:
      yggdrasil.io/node-pool: platform
  - role: worker
    labels:
      yggdrasil.io/node-pool: platform

  # ===========================================================================
  # Application Node Pool (3 Nodes — Web, Mail, Git Forge, CI Runners)
  # ===========================================================================
  - role: worker
    labels:
      yggdrasil.io/node-pool: apps
  - role: worker
    labels:
      yggdrasil.io/node-pool: apps
  - role: worker
    labels:
      yggdrasil.io/node-pool: apps
