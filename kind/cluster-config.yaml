kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: yggdrasil
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Web Hosting (HTTP / HTTPS via Ingress)
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # DNS (Mapped to 5353 on host by default to avoid WSL systemd-resolved conflict on port 53)
      - containerPort: 30053
        hostPort: 5353
        protocol: UDP
      - containerPort: 30053
        hostPort: 5353
        protocol: TCP
      # Email (SMTP, Submission, IMAPS)
      - containerPort: 30025
        hostPort: 2525
        protocol: TCP
      - containerPort: 30587
        hostPort: 587
        protocol: TCP
      - containerPort: 30993
        hostPort: 993
        protocol: TCP
  - role: worker
