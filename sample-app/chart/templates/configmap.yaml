apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-app.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
data:
  DJANGO_SETTINGS_MODULE: "config.settings"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  CSRF_TRUSTED_ORIGINS: "https://*.yggdrasil.local,http://*.yggdrasil.local,http://localhost,http://127.0.0.1"

  # Database Host
  {{- if .Values.inNamespaceDependencies.postgres.enabled }}
  DB_HOST: "{{ include "sample-app.fullname" . }}-postgres"
  DB_PORT: "5432"
  DB_NAME: {{ .Values.inNamespaceDependencies.postgres.database | quote }}
  DB_USER: {{ .Values.inNamespaceDependencies.postgres.username | quote }}
  {{- end }}

  # Redis Host
  {{- if .Values.inNamespaceDependencies.redis.enabled }}
  REDIS_HOST: "{{ include "sample-app.fullname" . }}-redis"
  REDIS_PORT: "6379"
  {{- end }}

  # RabbitMQ Host
  {{- if .Values.inNamespaceDependencies.rabbitmq.enabled }}
  RABBITMQ_HOST: "{{ include "sample-app.fullname" . }}-rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: {{ .Values.inNamespaceDependencies.rabbitmq.username | quote }}
  RABBITMQ_VHOST: "/"
  {{- end }}

  # SeaweedFS S3
  USE_S3: "{{ .Values.seaweedfs.enabled }}"
  AWS_S3_ENDPOINT_URL: {{ .Values.seaweedfs.endpointUrl | quote }}
  AWS_STORAGE_BUCKET_NAME: {{ .Values.seaweedfs.bucketName | quote }}

  # Structured Logging for VictoriaLogs
  LOG_FORMAT: {{ .Values.logging.format | default "json" | quote }}
  LOG_LEVEL: {{ .Values.logging.level | default "INFO" | quote }}
