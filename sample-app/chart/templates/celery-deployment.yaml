apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-app.fullname" . }}-celery-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celery.replicaCount }}
  selector:
    matchLabels:
      {{- include "sample-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        {{- include "sample-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: celery-worker
          image: {{ .Values.django.image.repository }}:{{ .Values.django.image.tag }}
          imagePullPolicy: {{ .Values.django.image.pullPolicy }}
          command:
            - celery
            - -A
            - config
            - worker
            - -l
            - info
            - --concurrency
            - "{{ .Values.celery.concurrency }}"
          envFrom:
            - configMapRef:
                name: {{ include "sample-app.fullname" . }}-config
            - secretRef:
                name: {{ include "sample-app.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.celery.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
