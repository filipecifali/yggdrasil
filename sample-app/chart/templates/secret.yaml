apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sample-app.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "sovereign-django-secret-key-{{ .Release.Name }}-{{ randAlphaNum 24 }}"
  {{- if .Values.inNamespaceDependencies.postgres.enabled }}
  DB_PASSWORD: {{ .Values.inNamespaceDependencies.postgres.password | quote }}
  {{- end }}
  {{- if .Values.inNamespaceDependencies.rabbitmq.enabled }}
  RABBITMQ_PASSWORD: {{ .Values.inNamespaceDependencies.rabbitmq.password | quote }}
  {{- end }}
  AWS_ACCESS_KEY_ID: {{ .Values.seaweedfs.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.seaweedfs.secretKey | quote }}
