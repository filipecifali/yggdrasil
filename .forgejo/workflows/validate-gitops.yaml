name: Yggdrasil GitOps & Configuration Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-configs:
    name: Validate GitOps Manifests, Security Policies & RBAC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository from in-cluster Forgejo
        run: |
          set -eu
          export PATH="/data/bin:${PATH}"
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE}"/.[!.]* 2>/dev/null || true
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH_URL="$(echo "${REPO_URL}" | sed -E "s|http(s)?://|http\1://${GITHUB_TOKEN}@|")"
          echo "==> Cloning ${GITHUB_REPOSITORY} @ ${GITHUB_SHA}..."
          git clone --no-checkout "${AUTH_URL}" "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git checkout --force "${GITHUB_SHA}"

      - name: Ensure test prerequisites (kubectl)
        run: |
          set -eu
          export PATH="/data/bin:${PATH}"
          if ! command -v kubectl >/dev/null 2>&1; then
            echo "==> Downloading kubectl into /data/bin/kubectl..."
            mkdir -p /data/bin
            wget -qO /data/bin/kubectl https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
            chmod +x /data/bin/kubectl
          fi
          kubectl version --client=true

      - name: Run Automated Cluster Configuration Test Suite
        run: |
          set -eu
          export PATH="/data/bin:${PATH}"
          cd "${GITHUB_WORKSPACE}"
          chmod +x scripts/test-cluster-configs.sh
          ./scripts/test-cluster-configs.sh

      - name: Enforce Zero Plaintext Secrets (Vault + ExternalSecrets Policy)
        run: |
          set -eu
          cd "${GITHUB_WORKSPACE}"
          echo "==> Checking for forbidden plaintext 'kind: Secret' manifests in apps/ and infrastructure/..."
          if grep -rn "^kind: Secret" apps/ infrastructure/; then
            echo "ERROR: Plaintext Kubernetes Secrets are forbidden. Store secrets in Vault and use ExternalSecret (vault-backend)."
            exit 1
          fi
          echo "PASS: All application secrets use ExternalSecret with ClusterSecretStore/vault-backend."

      - name: Enforce Zero PII and Local Usernames Policy
        run: |
          set -eu
          cd "${GITHUB_WORKSPACE}"
          echo "==> Checking for forbidden PII / local home paths in manifests and docs..."
          if grep -rEn "(/home/(fcs|filip)|[a-zA-Z0-9._%+-]+@filip)" \
             --exclude="test-cluster-configs.sh" \
             apps/ infrastructure/ docs/ clusters/ scripts/ kind/; then
            echo "ERROR: Found forbidden personal user home path in repository files!"
            exit 1
          fi
          echo "PASS: Zero PII detected."

      - name: Enforce Harbor OCI Helm Chart & Image Mirror Policy
        run: |
          set -eu
          cd "${GITHUB_WORKSPACE}"
          echo "==> Verifying all HelmRepositories point to in-cluster Harbor OCI mirror..."
          NON_HARBOR_REPOS="$(grep -E '^\s*url:' infrastructure/base/helm-repositories.yaml | grep -v 'oci://harbor.registry-system.svc.cluster.local/library' || true)"
          if [ -n "${NON_HARBOR_REPOS}" ]; then
            echo "ERROR: Found HelmRepository not using Harbor OCI mirror:"
            echo "${NON_HARBOR_REPOS}"
            exit 1
          fi
          echo "PASS: All 12 HelmRepositories point to oci://harbor.registry-system.svc.cluster.local/library."

      - name: Verify Kustomization Resource Integrity & Render Overlays
        run: |
          set -eu
          export PATH="/data/bin:${PATH}"
          cd "${GITHUB_WORKSPACE}"
          echo "==> Rendering Kustomize overlays with kubectl kustomize..."
          kubectl kustomize infrastructure/overlays/kind >/dev/null
          kubectl kustomize apps/overlays/kind >/dev/null
          kubectl kustomize clusters/kind/flux-system >/dev/null
          echo "PASS: All overlays rendered cleanly."
