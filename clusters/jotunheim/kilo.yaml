apiVersion: v1
kind: Namespace
metadata:
  name: vpn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kilo
  namespace: vpn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kilo
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "patch", "watch"]
  - apiGroups: ["kilo.squat.ai"]
    resources: ["peers"]
    verbs: ["list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kilo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kilo
subjects:
  - kind: ServiceAccount
    name: kilo
    namespace: vpn-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kilo
  namespace: vpn-system
  labels:
    app.kubernetes.io/name: kilo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kilo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kilo
    spec:
      serviceAccountName: kilo
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: kilo
          image: squat/kilo:0.7.0
          args:
            - --hostname=$(NODE_NAME)
            - --cni=false
            - --local=false
            - --interface=kilo0
            - --subnet=10.5.0.0/16
            - --service-cidr=10.112.0.0/12
            - --port=51820
            - --clean-up=true
            - --topology-label=yggdrasil.io/location
            - --iptables-forward-rules=true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 1107
          securityContext:
            privileged: true
          volumeMounts:
            - name: kilo-dir
              mountPath: /var/lib/kilo
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
      volumes:
        - name: kilo-dir
          hostPath:
            path: /var/lib/kilo
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
