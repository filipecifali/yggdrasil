# All Helm repositories are mirrored and hosted locally as OCI artifacts in Harbor
# (populated via ./scripts/mirror-charts-to-harbor.sh).
# Flux source-controller pulls charts over cluster-internal HTTP from Service/harbor.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  type: oci
  interval: 1h
  insecure: true
  url: oci://harbor.registry-system.svc.cluster.local/library
---
