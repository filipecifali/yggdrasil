apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda-system
spec:
  interval: 10m
  chart:
    spec:
      chart: keda
      version: ">=2.16.0 <3.0.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      install: true
    nodeSelector:
      yggdrasil.io/node-pool: platform
    prometheus:
      metricServer:
        enabled: true
      operator:
        enabled: true
