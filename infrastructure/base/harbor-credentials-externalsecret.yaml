apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-helm-credentials
  namespace: flux-system
  labels:
    yggdrasil.io/realm: sindri
    yggdrasil.io/tier: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-helm-credentials
    template:
      data:
        username: "admin"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: registry/harbor-admin
        property: HARBOR_ADMIN_PASSWORD
