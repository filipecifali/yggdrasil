apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-helm-credentials
  namespace: flux-system
  labels:
    yggdrasil.io/realm: sindri
    yggdrasil.io/tier: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-helm-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        username: "admin"
        password: "{{ .password }}"
        .dockerconfigjson: '{"auths":{"harbor.registry-system.svc.cluster.local":{"username":"admin","password":"{{ .password }}","auth":"{{ printf "admin:%s" .password | b64enc }}"},"registry.yggdrasil.local":{"username":"admin","password":"{{ .password }}","auth":"{{ printf "admin:%s" .password | b64enc }}"}}}'
  data:
    - secretKey: password
      remoteRef:
        key: registry/harbor-admin
        property: HARBOR_ADMIN_PASSWORD
