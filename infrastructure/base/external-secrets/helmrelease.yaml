apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      version: "0.20.4"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    nodeSelector:
      yggdrasil.io/node-pool: platform
    webhook:
      nodeSelector:
        yggdrasil.io/node-pool: platform
    certController:
      nodeSelector:
        yggdrasil.io/node-pool: platform
