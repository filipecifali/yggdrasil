apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: default
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: "1Gi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: web-limits
  namespace: web-system
  labels:
    yggdrasil.io/realm: midgard
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      type: Container
---
apiVersion: v1
kind: LimitRange
