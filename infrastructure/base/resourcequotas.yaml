apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: default
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "10"
    services: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: web-quota
  namespace: web-system
  labels:
    yggdrasil.io/realm: midgard
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    requests.storage: "20Gi"
    persistentvolumeclaims: "10"
    pods: "20"
    services: "10"
---
apiVersion: v1
