# Harbor Admin Secret pulled from HashiCorp Vault via External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin-credentials
  namespace: registry-system
  labels:
    yggdrasil.io/realm: sindri
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: registry/harbor-admin
        property: HARBOR_ADMIN_PASSWORD
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: registry-system
spec:
  interval: 10m
  chart:
    spec:
      chart: harbor
      version: ">=1.16.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
      interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: "(Deployment|StatefulSet)"
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  spec:
                    nodeSelector:
                      yggdrasil.io/node-pool: platform
  values:
    # Traffic is routed via Envoy Gateway (HTTPRoute -> Service/harbor:80)
    expose:
      type: clusterIP
      tls:
        enabled: false
      clusterIP:
        name: harbor
        ports:
          httpPort: 80

    # Use http:// scheme so harbor-core emits an http:// Www-Authenticate Bearer
    # token realm for internal Kind containerd pulls over Service ClusterIP (:80)
    # and local port-forward pushes; Envoy Gateway still terminates external TLS.
    externalURL: http://registry.yggdrasil.local

    # Reference Kubernetes Secret instead of inline plaintext password
    existingSecretAdminPassword: harbor-admin-credentials
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

    metrics:
      enabled: true

    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          size: 10Gi
        jobservice:
          jobLog:
            size: 1Gi
        database:
          size: 2Gi
        redis:
          size: 1Gi

    # Lightweight footprint for local Kind simulation
    trivy:
      enabled: false
    notary:
      enabled: false
