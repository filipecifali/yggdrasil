# S3 IAM credentials Secret pulled from HashiCorp Vault via External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-iam
  namespace: storage-system
  labels:
    yggdrasil.io/realm: nidavellir
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: seaweedfs-s3-iam
    creationPolicy: Owner
  data:
    - secretKey: seaweedfs_s3_config
      remoteRef:
        key: storage/seaweedfs-s3-iam
        property: seaweedfs_s3_config
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: storage-system
spec:
  interval: 10m
  chart:
    spec:
      chart: seaweedfs
      version: "4.53.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: "(Deployment|StatefulSet|DaemonSet|Job)"
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  spec:
                    nodeSelector:
                      yggdrasil.io/node-pool: platform
  values:
    global:
      imageName: registry.yggdrasil.local/library/seaweedfs
    master:
      replicas: 1
      data:
        type: "persistentVolumeClaim"
        size: "2Gi"
      logs:
        type: "emptyDir"
    volume:
      replicas: 1
      dataDirs:
        - name: data
          type: "persistentVolumeClaim"
          size: "10Gi"
          maxVolumes: 0
      logs:
        type: "emptyDir"
    filer:
      replicas: 1
      data:
        type: "persistentVolumeClaim"
        size: "2Gi"
      logs:
        type: "emptyDir"
      s3:
        enabled: true
        port: 8333
        enableAuth: true
        existingConfigSecret: seaweedfs-s3-iam
    s3:
      enabled: true
      replicas: 1
      port: 8333
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-iam
      logs:
        type: "emptyDir"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3
  namespace: storage-system
  labels:
    app.kubernetes.io/name: seaweedfs
    yggdrasil.io/realm: nidavellir
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
      namespace: envoy-gateway-system
  hostnames:
    - "s3.yggdrasil.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
      backendRefs:
        - name: seaweedfs-s3
          port: 8333
