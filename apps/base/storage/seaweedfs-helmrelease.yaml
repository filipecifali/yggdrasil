# S3 IAM credentials Secret (managed via ExternalSecret from Vault in production)
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-iam
  namespace: storage-system
  labels:
    yggdrasil.io/realm: nidavellir
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "yggdrasil-s3-admin",
          "credentials": [
            {
              "accessKey": "yggdrasil-local-access-key",
              "secretKey": "yggdrasil-local-secret-key-change-me"
            }
          ],
          "actions": ["Admin", "Read", "List", "Tagging", "Write"]
        }
      ]
    }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: storage-system
spec:
  interval: 10m
  chart:
    spec:
      chart: seaweedfs
      version: ">=4.0.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 1h
  values:
    master:
      replicas: 1
      data:
        type: "persistentVolumeClaim"
        size: "2Gi"
      logs:
        type: "emptyDir"
    volume:
      replicas: 1
      dataDirs:
        - name: data
          type: "persistentVolumeClaim"
          size: "10Gi"
          maxVolumes: 0
      logs:
        type: "emptyDir"
    filer:
      replicas: 1
      data:
        type: "persistentVolumeClaim"
        size: "2Gi"
      logs:
        type: "emptyDir"
      s3:
        enabled: true
        port: 8333
        enableAuth: true
        existingConfigSecret: seaweedfs-s3-iam
    s3:
      enabled: true
      replicas: 1
      port: 8333
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-iam
      logs:
        type: "emptyDir"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3
  namespace: storage-system
  labels:
    app.kubernetes.io/name: seaweedfs
    yggdrasil.io/realm: nidavellir
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
      namespace: envoy-gateway-system
  hostnames:
    - "s3.yggdrasil.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
      backendRefs:
        - name: seaweedfs-s3
          port: 8333
