apiVersion: batch/v1
kind: CronJob
metadata:
  name: roundcube-sqlite-backup
  namespace: mail-system
  labels:
    app.kubernetes.io/name: roundcube-sqlite-backup
    yggdrasil.io/realm: huginn-muninn
    yggdrasil.io/tier: apps
    soc2.compliance/control: A1.2
spec:
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: roundcube-sqlite-backup
            yggdrasil.io/realm: huginn-muninn
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            yggdrasil.io/node-pool: apps
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot-sqlite
              image: registry.yggdrasil.local/library/curl:8.12.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "==> Creating safe Roundcube SQLite snapshot copy..."
                  if [ -f /var/roundcube/db/sqlite.db ]; then
                    cp /var/roundcube/db/sqlite.db /backup/roundcube.db
                  else
                    echo "Database file not found, creating dummy marker"
                    echo "EMPTY_SNAPSHOT" > /backup/roundcube.db
                  fi
                  chmod 666 /backup/roundcube.db
                  echo "==> SQLite snapshot ready in /backup/roundcube.db"
              volumeMounts:
                - name: db
                  mountPath: /var/roundcube/db
                  readOnly: true
                - name: backup-volume
                  mountPath: /backup
          containers:
            - name: upload-s3
              image: registry.yggdrasil.local/library/curl:8.12.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TIMESTAMP=$(date +%Y%m%d%H%M)
                  TARGET="roundcube-sqlite-${TIMESTAMP}.db"
                  echo "==> Uploading SQLite snapshot to SeaweedFS S3 (/buckets/database-backups/roundcube/${TARGET})..."
                  curl -sf -F "file=@/backup/roundcube.db;filename=${TARGET}" \
                    "http://seaweedfs-filer.storage-system.svc.cluster.local:8888/buckets/database-backups/roundcube/"
                  echo "==> Roundcube SQLite backup uploaded successfully: ${TARGET}"
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
          volumes:
            - name: db
              persistentVolumeClaim:
                claimName: roundcube-db
            - name: backup-volume
              emptyDir: {}
