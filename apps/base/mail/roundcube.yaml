# Roundcube session encryption secret pulled from HashiCorp Vault via ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roundcube-secret
  namespace: mail-system
  labels:
    app.kubernetes.io/name: roundcube
    yggdrasil.io/realm: huginn-muninn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: roundcube-secret
    creationPolicy: Owner
  data:
    - secretKey: ROUNDCUBEMAIL_DES_KEY
      remoteRef:
        key: mail/roundcube
        property: ROUNDCUBEMAIL_DES_KEY
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roundcube-db
  namespace: mail-system
  labels:
    app.kubernetes.io/name: roundcube
    yggdrasil.io/realm: huginn-muninn
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundcube
  namespace: mail-system
  labels:
    app.kubernetes.io/name: roundcube
    yggdrasil.io/realm: huginn-muninn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: roundcube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roundcube
        yggdrasil.io/realm: huginn-muninn
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        yggdrasil.io/node-pool: apps
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roundcube
          image: registry.yggdrasil.local/library/roundcubemail:1.6.9-apache
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - secretRef:
                name: roundcube-secret
          env:
            - name: ROUNDCUBEMAIL_DB_TYPE
              value: "sqlite"
            - name: ROUNDCUBEMAIL_SKIN
              value: "elastic"
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: "docker-mailserver.mail-system.svc.cluster.local"
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: "143"
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: "docker-mailserver.mail-system.svc.cluster.local"
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: "25"
          volumeMounts:
            - name: db
              mountPath: /var/roundcube/db
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: roundcube-db
---
apiVersion: v1
kind: Service
metadata:
  name: roundcube
  namespace: mail-system
  labels:
    app.kubernetes.io/name: roundcube
    yggdrasil.io/realm: huginn-muninn
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: roundcube
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: roundcube-webmail
  namespace: mail-system
  labels:
    app.kubernetes.io/name: roundcube
    yggdrasil.io/realm: huginn-muninn
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
      namespace: envoy-gateway-system
  hostnames:
    - "webmail.yggdrasil.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        - name: roundcube
          port: 80
