apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zulip-web
  namespace: chat-system
  labels:
    app.kubernetes.io/name: zulip
    yggdrasil.io/realm: folkvangr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
      namespace: envoy-gateway-system
  hostnames:
    - "chat.yggdrasil.local"
    - "zulip.yggdrasil.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zulip
          port: 80
