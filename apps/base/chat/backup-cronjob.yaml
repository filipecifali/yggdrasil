apiVersion: batch/v1
kind: CronJob
metadata:
  name: zulip-postgres-backup
  namespace: chat-system
  labels:
    app.kubernetes.io/name: zulip-postgres-backup
    yggdrasil.io/realm: folkvangr
    yggdrasil.io/tier: apps
    soc2.compliance/control: A1.2
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zulip-postgres-backup
            yggdrasil.io/realm: folkvangr
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            yggdrasil.io/node-pool: apps
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump-encrypt-upload
              image: registry.yggdrasil.local/library/backup-tools:v1.0.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGPASSWORD
                  value: "ChangeMe123!"
                - name: PGUSER
                  value: "zulip"
                - name: PGHOST
                  value: "zulip-postgresql"
                - name: PGDATABASE
                  value: "zulip"
                - name: AGE_RECIPIENT
                  value: "age1ql3z7hjyfkpw34dssm7v9dtzn6rvs2xsmjp6slum6m34uvlp8sms2qqpw5"
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d%H%M)
                  TARGET="zulip-pg-${TIMESTAMP}.dump.age"
                  echo "==> Dumping, streaming through age asymmetric encryption, and uploading to S3..."
                  pg_dump -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" --format=custom \
                    | age -r "${AGE_RECIPIENT}" \
                    | curl -sf -F "file=@-;filename=${TARGET}" \
                        "http://seaweedfs-filer.storage-system.svc.cluster.local:8888/buckets/database-backups/zulip/"
                  echo "==> Encrypted Zulip DB backup completed: ${TARGET}"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
