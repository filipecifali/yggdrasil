# Zulip application secrets pulled from HashiCorp Vault via ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-secrets
  namespace: chat-system
  labels:
    yggdrasil.io/realm: folkvangr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zulip-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: chat/zulip
