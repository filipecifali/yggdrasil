# CloudFront-style Edge Traffic Policies (Compression, Rate Limiting, Timeouts, TLS 1.2/1.3 & HTTP/2)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: bifrost-edge-optimizations
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
  # Edge Response Compression (Brotli + Gzip)
  compression:
    - type: Brotli
    - type: Gzip
  # Edge Rate Limiting disabled for proto compatibility
  timeout:
    http:
      requestTimeout: 30s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: bifrost-client-hardening
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  http2:
    onInvalidMessage: TerminateStream
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    alpnProtocols:
      - h2
      - http/1.1
  timeout:
    http:
      idleTimeout: 60s
