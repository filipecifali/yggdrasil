# Forgejo Runner registration secret pulled from HashiCorp Vault via External Secrets Operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secret
  namespace: git-system
  labels:
    yggdrasil.io/realm: valhalla
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
  data:
    - secretKey: runner-token
      remoteRef:
        key: git/forgejo-runner
        property: runner-token
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner
  namespace: git-system
  labels:
    app.kubernetes.io/name: forgejo-runner
    yggdrasil.io/realm: valhalla
spec:
  serviceName: forgejo-runner
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
        yggdrasil.io/realm: valhalla
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        yggdrasil.io/node-pool: apps
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: registry.yggdrasil.local/library/forgejo-runner:6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          workingDir: /data
          command:
            - sh
            - -c
            - |
              while [ ! -f /data/.runner ]; do
                echo "Attempting to register forgejo-runner with Forgejo..."
                forgejo-runner register --no-interactive \
                  --instance "http://forgejo-http.git-system.svc.cluster.local:3000" \
                  --token "${FORGEJO_RUNNER_TOKEN}" \
                  --name "yggdrasil-runner" \
                  --labels "ubuntu-latest:host" || sleep 30
              done
              exec forgejo-runner daemon
          env:
            - name: FORGEJO_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: runner-token
          volumeMounts:
            - name: runner-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
