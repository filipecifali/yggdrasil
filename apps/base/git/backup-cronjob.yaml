apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-sqlite-backup
  namespace: git-system
  labels:
    app.kubernetes.io/name: forgejo-sqlite-backup
    yggdrasil.io/realm: valhalla
    yggdrasil.io/tier: apps
    soc2.compliance/control: A1.2
spec:
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forgejo-sqlite-backup
            yggdrasil.io/realm: valhalla
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            yggdrasil.io/node-pool: apps
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot-sqlite
              image: registry.yggdrasil.local/library/curl:8.12.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "==> Creating safe SQLite snapshot copy..."
                  if [ -f /data/gitea/gitea.db ]; then
                    cp /data/gitea/gitea.db /backup/forgejo.db
                  else
                    echo "Database file not found, creating dummy marker"
                    echo "EMPTY_SNAPSHOT" > /backup/forgejo.db
                  fi
                  chmod 666 /backup/forgejo.db
                  echo "==> SQLite snapshot ready in /backup/forgejo.db"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup-volume
                  mountPath: /backup
          containers:
            - name: upload-s3
              image: registry.yggdrasil.local/library/curl:8.12.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TIMESTAMP=$(date +%Y%m%d%H%M)
                  TARGET="forgejo-sqlite-${TIMESTAMP}.db"
                  echo "==> Uploading SQLite snapshot to SeaweedFS S3 (/buckets/database-backups/forgejo/${TARGET})..."
                  curl -sf -F "file=@/backup/forgejo.db;filename=${TARGET}" \
                    "http://seaweedfs-filer.storage-system.svc.cluster.local:8888/buckets/database-backups/forgejo/"
                  echo "==> Forgejo SQLite backup uploaded successfully: ${TARGET}"
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: forgejo-data
            - name: backup-volume
              emptyDir: {}
