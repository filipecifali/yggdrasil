apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yggdrasil-cluster-admins
  labels:
    yggdrasil.io/realm: asgard
    yggdrasil.io/tier: security
subjects:
  - kind: Group
    name: cluster-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yggdrasil-platform-operator
  labels:
    yggdrasil.io/realm: asgard
    yggdrasil.io/tier: security
rules:
  # Core Infrastructure & Workload Management
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
      - secrets
      - services
      - endpoints
      - pods
      - pods/log
      - pods/status
      - pods/exec
      - pods/portforward
      - events
      - limitranges
      - resourcequotas
    verbs: ["*"]
  # Apps & Batch Controllers
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["*"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingressclasses", "ingresses"]
    verbs: ["*"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  # GitOps / Flux Toolkit
  - apiGroups:
      - "kustomize.toolkit.fluxcd.io"
      - "helm.toolkit.fluxcd.io"
      - "source.toolkit.fluxcd.io"
      - "notification.toolkit.fluxcd.io"
    resources: ["*"]
    verbs: ["*"]
  # Cert-Manager PKI
  - apiGroups: ["cert-manager.io", "acme.cert-manager.io"]
    resources: ["*"]
    verbs: ["*"]
  # External Secrets & Vault
  - apiGroups: ["external-secrets.io"]
    resources: ["*"]
    verbs: ["*"]
  # Monitoring & VictoriaMetrics
  - apiGroups: ["operator.victoriametrics.com", "monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
  # CloudNative-PG Operator
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yggdrasil-platform-ops
  labels:
    yggdrasil.io/realm: asgard
    yggdrasil.io/tier: security
subjects:
  - kind: Group
    name: platform-ops
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: yggdrasil-platform-operator
  apiGroup: rbac.authorization.k8s.io
---
