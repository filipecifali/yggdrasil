apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-s3-backup
  namespace: vault-system
  labels:
    app.kubernetes.io/name: vault-raft-s3-backup
    yggdrasil.io/realm: valhalla
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-raft-s3-backup
            yggdrasil.io/realm: valhalla
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            yggdrasil.io/node-pool: platform
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: take-snapshot
              image: registry.yggdrasil.local/library/vault:1.19.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ROOT_TOKEN=$(cat /etc/vault-keys/root-token)
                  echo "==> Taking Vault Raft snapshot..."
                  VAULT_TOKEN="${ROOT_TOKEN}" vault operator raft snapshot save -address=http://vault.vault-system:8200 /backup/vault-raft.snap
                  chmod 666 /backup/vault-raft.snap
                  echo "==> Snapshot saved and permissions set to 666: /backup/vault-raft.snap"
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
                - name: vault-init-keys
                  mountPath: /etc/vault-keys
                  readOnly: true
          containers:
            - name: upload-s3
              image: registry.yggdrasil.local/library/curl:8.12.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TIMESTAMP=$(date +%Y%m%d%H%M)
                  TARGET="vault-snapshot-${TIMESTAMP}.snap"
                  echo "==> Uploading snapshot to SeaweedFS S3 (/buckets/vault-backups/${TARGET})..."
                  curl -sf -F "file=@/backup/vault-raft.snap;filename=${TARGET}" \
                    "http://seaweedfs-filer.storage-system.svc.cluster.local:8888/buckets/vault-backups/"
                  echo "==> Vault Raft backup completed successfully: ${TARGET}"
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
          volumes:
            - name: backup-volume
              emptyDir: {}
            - name: vault-init-keys
              secret:
                secretName: vault-init-keys
                items:
                  - key: root-token
                    path: root-token
