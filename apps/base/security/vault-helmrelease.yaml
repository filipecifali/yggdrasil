apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault-system
spec:
  interval: 10m
  chart:
    spec:
      chart: vault
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
      interval: 1h
  values:
    injector:
      enabled: false
    server:
      image:
        repository: registry.yggdrasil.local/library/vault
        tag: "1.19.0"
      nodeSelector: |
        yggdrasil.io/node-pool: platform
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      readinessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true"
      standalone:
        enabled: true
        config: |
          ui = true
          disable_mlock = true
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            telemetry {
              unauthenticated_metrics_access = true
            }
          }
          storage "raft" {
            path = "/vault/data"
          }
          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname = true
          }
      dataStorage:
        enabled: true
        size: 2Gi
    ui:
      enabled: true
      serviceType: "ClusterIP"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-ui
  namespace: vault-system
  labels:
    app.kubernetes.io/name: vault
    yggdrasil.io/realm: andvari
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
      namespace: envoy-gateway-system
  hostnames:
    - "vault.yggdrasil.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
              - name: Referrer-Policy
                value: "no-referrer"
      backendRefs:
        - name: vault
          port: 8200
