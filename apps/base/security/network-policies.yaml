# Restrict ingress to CloudNativePG PostgreSQL (port 5432) only to in-cluster namespaces and monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-internal-only
  namespace: storage-system
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: yggdrasil-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
---
# Restrict ingress to HashiCorp Vault (ports 8200/8201) strictly to Envoy Gateway, External Secrets, Monitoring, and Vault peers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-restricted-ingress
  namespace: vault-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-system
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
