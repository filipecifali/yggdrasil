# Restrict ingress to CloudNativePG PostgreSQL (port 5432) strictly to authorized application namespaces and monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-authorized-only
  namespace: storage-system
  labels:
    yggdrasil.io/realm: nidavellir
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: yggdrasil-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - storage-system
                  - git-system
                  - auth-system
                  - registry-system
                  - chat-system
                  - mail-system
                  - monitoring-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
---
# Restrict ingress to Authentik database strictly to auth-system and monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-pg-restricted-ingress
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-system
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
---
# Restrict ingress to Authentik server strictly to Envoy Gateway, monitoring, and internal auth pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-server-ingress
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
      ports:
        - protocol: TCP
          port: 9300
---
# Restrict ingress to HashiCorp Vault (ports 8200/8201) strictly to Envoy Gateway, External Secrets, Monitoring, and Vault peers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-restricted-ingress
  namespace: vault-system
  labels:
    yggdrasil.io/realm: valhalla
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-system
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
