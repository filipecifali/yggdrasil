# Authentik PostgreSQL application credentials pulled from HashiCorp Vault via ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-user
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-pg-user
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: auth/authentik-db
        property: username
    - secretKey: password
      remoteRef:
        key: auth/authentik-db
        property: password
---
# Authentik PostgreSQL S3 backup credentials pulled from Vault via ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-cnpg-s3-backup-secret
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-cnpg-s3-backup-secret
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: storage/s3-credentials
        property: ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: storage/s3-credentials
        property: ACCESS_SECRET_KEY
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  description: "Dedicated PostgreSQL cluster for Authentik Identity Provider (Gladsheim)"
  instances: 1
  imageName: registry.yggdrasil.local/library/postgresql:18.1
  affinity:
    nodeSelector:
      yggdrasil.io/node-pool: platform
  storage:
    size: 5Gi
  monitoring:
    enablePodMonitor: false
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/authentik-pg/"
      endpointURL: "http://seaweedfs-s3.storage-system.svc.cluster.local:8333"
      s3Credentials:
        accessKeyId:
          name: authentik-cnpg-s3-backup-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: authentik-cnpg-s3-backup-secret
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 1
    retentionPolicy: "30d"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-pg-user
  postgresql:
    pg_hba:
      - hostssl all all all scram-sha-256
      - host all all 10.0.0.0/8 scram-sha-256
      - host all all 172.16.0.0/12 scram-sha-256
    parameters:
      password_encryption: "scram-sha-256"
      max_connections: "200"
      shared_buffers: "128MB"
      log_connections: "on"
      log_disconnections: "on"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-pg-daily-backup
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-pg
