# Authentik PostgreSQL application credentials pulled from HashiCorp Vault via ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-user
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-pg-user
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: auth/authentik-db
        property: username
    - secretKey: password
      remoteRef:
        key: auth/authentik-db
        property: password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  description: "Dedicated PostgreSQL cluster for Authentik Identity Provider (Gladsheim)"
  instances: 1
  imageName: registry.yggdrasil.local/library/postgresql:18.1
  affinity:
    nodeSelector:
      yggdrasil.io/node-pool: platform
  storage:
    size: 5Gi
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-pg-user
  postgresql:
    pg_hba:
      - hostssl all all all scram-sha-256
      - host all all 10.0.0.0/8 scram-sha-256
      - host all all 172.16.0.0/12 scram-sha-256
    parameters:
      password_encryption: "scram-sha-256"
      max_connections: "200"
      shared_buffers: "128MB"
      log_connections: "on"
      log_disconnections: "on"
