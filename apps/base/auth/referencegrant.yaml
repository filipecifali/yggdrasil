apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-monitoring-to-auth
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: monitoring-system
  to:
    - group: ""
      kind: Service
      name: authentik-server
