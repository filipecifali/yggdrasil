# Authentik application configuration and secrets pulled from HashiCorp Vault via ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: auth-system
  labels:
    yggdrasil.io/realm: gladsheim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: auth/authentik
