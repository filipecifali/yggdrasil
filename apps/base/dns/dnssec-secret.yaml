# DNSSEC Combined Signing Key (CSK) for yggdrasil.local pulled from HashiCorp Vault
# via External Secrets Operator (ClusterSecretStore/vault-backend).
# Corresponding Registrar DS Record:
#   yggdrasil.local. IN DS 5707 13 2 ACCAEB344833CE8A6829D1CE557C01996ADBDF1854480B10C1D0188BCBE0514B
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coredns-dnssec-keys
  namespace: dns-system
  labels:
    yggdrasil.io/realm: mimir
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: coredns-dnssec-keys
    creationPolicy: Owner
  data:
    - secretKey: dnssec.key
      remoteRef:
        key: dns/coredns-dnssec-keys
        property: dnssec.key
    - secretKey: dnssec.private
      remoteRef:
        key: dns/coredns-dnssec-keys
        property: dnssec.private
