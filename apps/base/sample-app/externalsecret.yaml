# ==============================================================================
# Sample App Secrets pulled from HashiCorp Vault via External Secrets Operator
# Enforces Zero Plaintext Secrets Policy
# ==============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-app-secrets
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    yggdrasil.io/realm: midgard
    yggdrasil.io/tier: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: sample-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: web/sample-app
        property: DJANGO_SECRET_KEY
    - secretKey: DB_PASSWORD
      remoteRef:
        key: web/sample-app
        property: DB_PASSWORD
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: web/sample-app
        property: RABBITMQ_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: storage/s3-credentials
        property: ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: storage/s3-credentials
        property: ACCESS_SECRET_KEY
