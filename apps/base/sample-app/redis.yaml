apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-redis
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: redis
    yggdrasil.io/realm: midgard
    yggdrasil.io/tier: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
        app.kubernetes.io/component: redis
        yggdrasil.io/realm: midgard
        yggdrasil.io/tier: apps
    spec:
      nodeSelector:
        yggdrasil.io/node-pool: apps
      containers:
        - name: redis
          image: registry.yggdrasil.local/library/redis:7.2.7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-redis
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: redis
    yggdrasil.io/realm: midgard
    yggdrasil.io/tier: apps
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: redis
