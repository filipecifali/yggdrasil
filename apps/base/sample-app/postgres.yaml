apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-postgres
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: postgres
    yggdrasil.io/realm: midgard
    yggdrasil.io/tier: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
        app.kubernetes.io/component: postgres
        yggdrasil.io/realm: midgard
        yggdrasil.io/tier: apps
    spec:
      nodeSelector:
        yggdrasil.io/node-pool: apps
      containers:
        - name: postgresql
          image: registry.yggdrasil.local/library/postgresql:18.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: "sample_app"
            - name: POSTGRES_USER
              value: "sample_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-app-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U sample_user -d sample_app -h 127.0.0.1 -p 5432
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U sample_user -d sample_app -h 127.0.0.1 -p 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-postgres
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: postgres
    yggdrasil.io/realm: midgard
    yggdrasil.io/tier: apps
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: postgres
