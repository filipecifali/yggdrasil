apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: monitoring-system
  labels:
    yggdrasil.io/realm: hlidskjalf
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/grafana
