apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: yggdrasil-vmsingle
  namespace: monitoring-system
  labels:
    yggdrasil.io/realm: hlidskjalf
spec:
  image:
    repository: registry.yggdrasil.local/library/victoria-metrics
    tag: v1.115.0
  retentionPeriod: "30d"
  nodeSelector:
    yggdrasil.io/node-pool: platform
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: yggdrasil-vmagent
  namespace: monitoring-system
  labels:
    yggdrasil.io/realm: hlidskjalf
spec:
  image:
    repository: registry.yggdrasil.local/library/vmagent
    tag: v1.115.0
  selectAllByDefault: true
  scrapeInterval: 30s
  nodeSelector:
    yggdrasil.io/node-pool: platform
  remoteWrite:
    - url: "http://vmsingle-yggdrasil-vmsingle.monitoring-system.svc.cluster.local:8429/api/v1/write"
  inlineRelabelConfig:
    - action: replace
      targetLabel: cluster
      replacement: yggdrasil-sovereign
    - action: replace
      targetLabel: sovereign_tier
      replacement: primary
    - action: drop
      sourceLabels: [__name__]
      regex: "(go_memstats_gc_sys_bytes|go_memstats_other_sys_bytes)"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics-ui
  namespace: monitoring-system
  labels:
    app.kubernetes.io/name: victoriametrics
    yggdrasil.io/realm: hlidskjalf
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
      namespace: envoy-gateway-system
  hostnames:
    - "metrics.yggdrasil.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vmsingle-yggdrasil-vmsingle
          port: 8429
