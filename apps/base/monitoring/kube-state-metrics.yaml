apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring-system
  labels:
    yggdrasil.io/realm: hlidskjalf
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: kube-state-metrics
      version: "9.0.0"
      sourceRef:
        kind: HelmRepository
        name: kube-state-metrics
        namespace: flux-system
      interval: 1h
  values:
    image:
      registry: registry.yggdrasil.local
      repository: library/kube-state-metrics
      tag: "v2.20.0"

    nodeSelector:
      yggdrasil.io/node-pool: platform

    prometheus:
      monitor:
        enabled: false

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kube-state-metrics
  namespace: monitoring-system
  labels:
    yggdrasil.io/realm: hlidskjalf
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  endpoints:
    - port: http
      interval: 30s
