apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: yggdrasil-vlsingle
  namespace: monitoring-system
  labels:
    yggdrasil.io/realm: hlidskjalf
spec:
  image:
    repository: registry.yggdrasil.local/library/victoria-logs
    tag: v1.53.0
  retentionPeriod: "365d"
  nodeSelector:
    yggdrasil.io/node-pool: platform
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victorialogs-ui
  namespace: monitoring-system
  labels:
    app.kubernetes.io/name: victorialogs
    yggdrasil.io/realm: hlidskjalf
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bifrost
      namespace: envoy-gateway-system
  hostnames:
    - "logs.yggdrasil.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vlsingle-yggdrasil-vlsingle
          port: 9428
