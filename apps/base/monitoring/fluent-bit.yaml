apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: monitoring-system
  labels:
    yggdrasil.io/realm: hlidskjalf
spec:
  interval: 10m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: fluent-bit
      version: "0.58.3"
      sourceRef:
        kind: HelmRepository
        name: fluent-bit
        namespace: flux-system
      interval: 1h
  values:
    image:
      repository: registry.yggdrasil.local/library/fluent-bit
      tag: "5.1.3"

    tolerations:
      - operator: Exists

    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 1
            Log_Level info
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
            Health_Check On

      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 15MB
            Skip_Long_Lines On

      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Merge_Log On
            Keep_Log Off
            K8S-Logging.Parser On
            K8S-Logging.Exclude On

      outputs: |
        [OUTPUT]
            Name http
            Match kube.*
            Host vlsingle-yggdrasil-vlsingle.monitoring-system.svc.cluster.local
            Port 9428
            URI /insert/jsonline?_stream_fields=stream,kubernetes.pod_name,kubernetes.namespace_name,kubernetes.container_name&_msg_field=log&_time_field=date
            Format json_lines
            json_date_key date
            json_date_format iso8601
            Compress gzip
            Retry_Limit 5

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
