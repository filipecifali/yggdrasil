apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: monitoring-authentik-extauth
  namespace: monitoring-system
  labels:
    yggdrasil.io/realm: hlidskjalf
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victoriametrics-ui
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victorialogs-ui
  extAuth:
    failOpen: false
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          namespace: auth-system
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - X-authentik-username
        - X-authentik-email
