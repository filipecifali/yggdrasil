apiVersion: v1
kind: Service
metadata:
  name: bifrost-kind-external
  namespace: envoy-gateway-system
  labels:
    yggdrasil.io/realm: bifrost
spec:
  type: NodePort
  selector:
    gateway.envoyproxy.io/owning-gateway-name: bifrost
    gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
  ports:
    - name: http
      port: 80
      targetPort: 10080
      nodePort: 31080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 10443
      nodePort: 31443
      protocol: TCP
