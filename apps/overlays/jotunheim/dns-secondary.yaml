# ==============================================================================
# CoreDNS Cross-Cluster Secondary Zone Transfer (AXFR) Configuration (Jotunheim)
# Configures Jotunheim CoreDNS instance as secondary authoritative server for
# 'yggdrasil.local' transferring zone data from Yggdrasil primary CoreDNS.
# ==============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: dns-system
spec:
  values:
    servers:
      - zones:
          - zone: yggdrasil.local.
            scheme: dns://
        port: 53
        plugins:
          - name: errors
          - name: log
          - name: secondary
            configBlock: |
              transfer from 10.4.0.1:53
          - name: cache
            parameters: 30
          - name: reload
          - name: prometheus
            parameters: 0.0.0.0:9153
