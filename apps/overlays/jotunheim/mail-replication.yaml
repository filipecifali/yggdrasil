# ==============================================================================
# Docker-Mailserver Secondary MX & Dovecot Cluster Replication (Jotunheim)
# Configures Jotunheim mail instance as Secondary MX (Priority 20) with
# Dovecot dsync replication capability over the WireGuard mesh tunnel.
# ==============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docker-mailserver
  namespace: mail-system
spec:
  values:
    deployment:
      env:
        OVERRIDE_HOSTNAME: "mail.jotunheim.local"
        RELAY_HOST: "mail.yggdrasil.local"
        ENABLE_MANAGESIEVE: 1
        ENABLE_UPDATE_CHECK: 0
