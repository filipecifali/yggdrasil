apiVersion: v1
kind: Service
metadata:
  name: mailserver-kind-external
  namespace: mail-system
  labels:
    yggdrasil.io/realm: huginn-muninn
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: docker-mailserver
  ports:
    - name: smtp
      port: 25
      targetPort: 25
      nodePort: 31025
      protocol: TCP
    - name: submission
      port: 587
      targetPort: 587
      nodePort: 31587
      protocol: TCP
    - name: imaps
      port: 993
      targetPort: 993
      nodePort: 31993
      protocol: TCP
