apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - gateway-nodeport.yaml
  - dns-nodeport.yaml
  - mail-nodeport.yaml

patches:
  - target:
      kind: CronJob
      name: .*
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: all-cronjobs
      spec:
        suspend: true
