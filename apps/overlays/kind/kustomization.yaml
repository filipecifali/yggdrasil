apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - gateway-nodeport.yaml
  - dns-nodeport.yaml
  - mail-nodeport.yaml

patches:
  - target:
      kind: CronJob
      name: zulip-postgres-backup
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target:
      kind: CronJob
      name: vault-raft-s3-backup
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
