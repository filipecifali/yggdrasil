apiVersion: v1
kind: Service
metadata:
  name: coredns-kind-external
  namespace: dns-system
  labels:
    yggdrasil.io/realm: mimir
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: coredns
    app.kubernetes.io/name: coredns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      nodePort: 30053
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      nodePort: 30053
      protocol: TCP
